name: Perpetual Auto-Update (Years & Metrics)

on:
  schedule:
    # Run at midnight every Sunday, and every January 1st to roll over the year
    - cron: '0 0 * * 0'
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate Dynamic Experience & Timestamp
        run: |
          CURRENT_YEAR=$(date +'%Y')
          EXP_YEARS=$((CURRENT_YEAR - 2020))
          echo "Current Year: $CURRENT_YEAR"
          echo "Years of Experience: $EXP_YEARS"
          
          # Dynamically update the experience badge if year incremented
          sed -i -E "s/EXPERIENCE-[0-9]+\%2B\%20YEARS\%20\(SINCE\%202020\)/EXPERIENCE-${EXP_YEARS}\%2B\%20YEARS\%20\(SINCE\%202020\)/g" README.md
          
          # Dynamically update the footer year
          sed -i -E "s/© <span id=\"year\">[0-9]+<\/span>/© <span id=\"year\">${CURRENT_YEAR}<\/span>/g" README.md

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "chore(auto-update): roll over year & experience metrics [skip ci]"
            git push
          else
            echo "No changes needed; metrics are up to date."
          fi
